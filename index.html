<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>فضاء الدروس</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Scheherazade+New:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&display=swap">
<style>
/* Layout: sticky masthead + four-tab single page; lessons read like a notebook sheet (header, date line, numbered points). */
:root{
  --bg:#f3f6f5; --surface:#ffffff; --ink:#10302f; --muted:#52706e; --line:#d4e0de;
  --accent:#0e6b66; --accent-ink:#ffffff; --gold:#a8690d; --gold-soft:#f7ead2;
  --good:#1c7a45; --good-soft:#dff2e6; --warn:#a15c00; --warn-soft:#fbe9c9; --bad:#a3322b; --bad-soft:#f8dedb;
  --f-display:"Reem Kufi","Amiri",serif; --f-book:"Amiri","Noto Naskh Arabic",serif; --f-body:"Noto Naskh Arabic","Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1a19; --surface:#122625; --ink:#e3f0ee; --muted:#93b0ad; --line:#24403e;
  --accent:#4fc3bb; --accent-ink:#06211f; --gold:#e5b25d; --gold-soft:#3a2e14;
  --good:#6fd39a; --good-soft:#143324; --warn:#f0b45a; --warn-soft:#3a2b10; --bad:#f08a82; --bad-soft:#3b1b18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1a19; --surface:#122625; --ink:#e3f0ee; --muted:#93b0ad; --line:#24403e;
  --accent:#4fc3bb; --accent-ink:#06211f; --gold:#e5b25d; --gold-soft:#3a2e14;
  --good:#6fd39a; --good-soft:#143324; --warn:#f0b45a; --warn-soft:#3a2b10; --bad:#f08a82; --bad-soft:#3b1b18; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.9;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:900px;margin:0 auto}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--accent)}
header.top{background:var(--accent);color:var(--accent-ink);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:22px max(16px,env(safe-area-inset-left,0px)) 0}
header.top .wrap{display:flex;flex-direction:column;gap:4px}
.school{font-size:.9rem;opacity:.85}
h1{font-family:var(--f-display);font-size:clamp(1.8rem,5vw,2.6rem);line-height:1.3;margin:0;font-weight:700}
.teacher{font-size:.95rem;opacity:.9;margin-bottom:14px}
nav.tabs{display:flex;flex-wrap:wrap;gap:2px 4px}
nav.tabs button{background:transparent;border:0;color:inherit;opacity:.8;padding:9px 12px;border-radius:10px 10px 0 0;cursor:pointer;white-space:nowrap;font-weight:600}
nav.tabs button[aria-selected="true"]{background:var(--bg);color:var(--ink);opacity:1}
main{padding-top:24px;display:flex;flex-direction:column;gap:20px}
h2{font-family:var(--f-display);font-size:1.5rem;margin:0;line-height:1.5}
h3{font-family:var(--f-display);font-size:1.15rem;margin:0}
p{margin:0}
.lead{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);padding:4px 16px;border-radius:999px;cursor:pointer;line-height:1.7}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;text-align:start;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0}
.lcard:hover{border-color:var(--accent)}
.lcard small{color:var(--gold);font-weight:600}
.lcard span{color:var(--muted);font-size:.92rem;line-height:1.7}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px clamp(16px,4vw,36px) 28px;display:flex;flex-direction:column;gap:14px;
  background-image:repeating-linear-gradient(transparent 0 33px,color-mix(in srgb,var(--line) 70%,transparent) 33px 34px)}
.sheet .dateline{color:var(--muted);border-bottom:2px dashed var(--line);padding-bottom:6px}
.sheet .meta{display:flex;flex-wrap:wrap;gap:6px 24px;font-size:.95rem;color:var(--muted)}
.sheet .meta b{color:var(--ink)}
.sheet h2{font-family:var(--f-book);font-size:1.7rem;text-align:center}
.sheet .blk{display:flex;flex-direction:column;gap:6px}
.sheet .blk h3{color:var(--accent)}
.sheet ol,.sheet ul{margin:0;padding-inline-start:1.4em}
.memo{background:var(--gold-soft);border-radius:8px;padding:12px 16px;font-family:var(--f-book);font-size:1.25rem;line-height:2.1}
.memo small{display:block;font-family:var(--f-body);font-size:.85rem;color:var(--gold);font-weight:700}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:6px 18px;cursor:pointer;font-weight:600}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.q .ans{background:var(--good-soft);color:var(--ink);border-radius:8px;padding:8px 12px}
.q .src{font-size:.85rem;color:var(--gold);font-weight:600}
.sit{border:2px solid var(--gold);border-radius:10px;padding:14px 16px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.sit ol{margin:0;padding-inline-start:1.4em}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
label{font-weight:600;display:block}
select,input[type=text]{width:100%;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:4px 12px}
.fld{flex:1 1 200px;min-width:0}
.note{font-size:.9rem;color:var(--muted)}
.demo{background:var(--warn-soft);color:var(--ink);border-radius:8px;padding:8px 12px;font-size:.92rem}
.err{background:var(--bad-soft);border-radius:8px;padding:8px 12px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.sumi{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.pill{display:inline-block;padding:0 10px;border-radius:99px;font-size:.85rem;font-weight:700}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.mid{background:var(--warn-soft);color:var(--warn)}.pill.low{background:var(--bad-soft);color:var(--bad)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{padding:8px 12px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.85rem;color:var(--muted);letter-spacing:.02em}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.subj{margin-bottom:12px}.subj .chip{background:transparent;color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent-ink) 50%,transparent)}.subj .chip[aria-pressed="true"]{background:var(--accent-ink);color:var(--accent)}
a.btn{display:inline-block;text-decoration:none}
.steps{margin:0;padding-inline-start:1.4em}
footer{margin-top:24px;color:var(--muted);font-size:.9rem;border-top:1px solid var(--line);padding-top:12px}
@media (prefers-reduced-motion:no-preference){.sheet,.q,.sit{animation:in .25s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}}}
</style>
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<style>
.lcard.soon{border-style:dashed;cursor:default;opacity:.7}.lcard.soon:hover{border-color:var(--line)}
.hint{background:var(--gold-soft);border-radius:8px;padding:8px 14px;font-size:.95rem}
.proofs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.proof{background:var(--gold-soft);border-radius:8px;padding:10px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.proof b{color:var(--gold)}.proof small{color:var(--muted)}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.grp{border:1px solid var(--line);border-radius:8px;padding:10px 14px;background:var(--surface);min-width:0}.grp h4{margin:0 0 4px;font-family:var(--f-display);color:var(--accent)}.grp ol{margin:0;padding-inline-start:1.4em}
.ayat{font-family:var(--f-book);font-size:1.2rem;line-height:2.1}
td.ayat{background:var(--gold-soft);min-width:220px}
.sheet .tw{margin-block:4px}
.mapbox{border:2px dashed var(--accent);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.mapbox figure{margin:0;overflow-x:auto}.mapbox img{width:100%;height:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
@media (max-width:640px){.sheet table{min-width:0}.sheet thead{display:none}.sheet table,.sheet tbody,.sheet tr,.sheet td{display:block}
.sheet .tw{border:0;background:transparent}.sheet tr{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;padding:6px 0}
.sheet td{border:0;padding:2px 14px}.sheet td::before{content:attr(data-label) ": ";color:var(--muted);font-size:.85rem;font-weight:600}
td.ayat{min-width:0;background:transparent}.sheet td.ayat{margin-top:4px}}
</style>
<style>
/* واجهة عامة: بطاقات المواد، بحث، تتبّع القراءة، وضع ليلي، طباعة */
header.top{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 62%,#000));position:relative;overflow:hidden}
header.top::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.08;background:radial-gradient(circle at 12% 20%,#fff 0 2px,transparent 3px) 0 0/34px 34px,radial-gradient(circle at 70% 70%,#fff 0 2px,transparent 3px) 17px 17px/34px 34px}
header.top .wrap{position:relative;z-index:1}
.toprow{display:flex;align-items:center;gap:10px}
.toprow h1{flex:1;cursor:pointer}
.tagline{font-size:.95rem;opacity:.9;margin-bottom:6px}
.subjline{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:.92rem;opacity:.95;margin-bottom:10px}
.subjline b{background:color-mix(in srgb,var(--accent-ink) 18%,transparent);border-radius:999px;padding:0 12px}
.iconbtn{background:color-mix(in srgb,var(--accent-ink) 16%,transparent);border:0;color:var(--accent-ink);border-radius:999px;width:42px;height:42px;font-size:1.1rem;cursor:pointer;flex:none}
.hero{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.scard{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--accent);border-radius:14px;padding:18px;text-align:start;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0;transition:transform .15s,box-shadow .15s}
.scard:hover{transform:translateY(-2px);box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 18%,transparent)}
.scard .ic{font-size:2rem;line-height:1.2}
.scard h3{font-size:1.3rem}
.scard .lv{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}.scard .lv i{font-style:normal;font-size:.8rem;border:1px solid var(--line);border-radius:999px;padding:0 10px;color:var(--muted)}
.search{position:relative}
.lcard{position:relative;border-inline-start:4px solid var(--accent);transition:transform .15s,box-shadow .15s}
.lcard:not(.soon):hover{transform:translateY(-1px);box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 14%,transparent)}
.lcard .no{position:absolute;inset-inline-end:12px;top:10px;min-width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:.9rem}
.lcard.soon .no{background:var(--line);color:var(--muted)}
.lcard h3{padding-inline-end:38px}
.sheet p,.sheet li,.sheet td{overflow-wrap:anywhere}
.seen{color:var(--good);font-size:.82rem;font-weight:700}
.stat{display:flex;flex-wrap:wrap;gap:8px}.stat span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 14px;font-size:.9rem}
@media print{header.top,nav,.row,.mapbox,footer,.hint,#toq,.noprint{display:none!important}body{background:#fff;color:#000;padding:0}.sheet{border:0;background:none}}
</style>
<style>
/* مذكرات الأستاذ */
.plan .phead{text-align:center;font-weight:700;line-height:1.9;border-bottom:3px double var(--accent);padding-bottom:8px;margin-bottom:12px}
.plan .phead div:last-child{font-family:var(--f-display);font-size:1.25rem;color:var(--accent);margin-top:4px}
.pinfo{display:grid;grid-template-columns:minmax(90px,16%) 1fr minmax(90px,16%) 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:8px}
.pinfo .c{padding:8px 12px;border-bottom:1px solid var(--line);min-width:0;overflow-wrap:anywhere}
.pinfo .k,.pkv .k{background:var(--gold-soft);font-weight:700;color:var(--gold)}
.pkv{display:grid;grid-template-columns:minmax(120px,22%) 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pkv>div{padding:8px 12px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.pkv>div:nth-last-child(-n+2){border-bottom:0}
.pbox{border:2px solid var(--accent);border-radius:10px;padding:12px 16px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.plan h3{margin-top:14px}
.plan .tw td:first-child{font-weight:700;color:var(--accent);white-space:nowrap}
@media (max-width:640px){.pinfo{grid-template-columns:1fr}.pkv{grid-template-columns:1fr}.pkv .k{border-bottom:0}.plan .tw td:first-child{white-space:normal}}
@page{size:A4;margin:7mm}@media print{.plan{font-size:9pt!important;line-height:1.45!important;padding:0!important}.plan *{line-height:1.45!important}.plan h3{margin:6px 0 3px!important;font-size:11pt!important}.plan .phead{padding-bottom:3px;margin-bottom:5px;line-height:1.4}.plan .phead div:last-child{font-size:12pt;margin-top:1px}.plan .blk{gap:2px!important;margin:0!important}.pinfo,.pkv,.pbox,.plan .tw{border:1px solid #000!important;border-radius:0!important;margin-block:0!important}.plan .pinfo .c,.plan .pkv>div{padding:2px 6px!important;border-color:#000!important}.plan .tw table{min-width:0;width:100%}.plan table,.plan td,.plan th{border:1px solid #000;font-size:8.5pt;padding:1px 4px!important}.plan th{color:#000;font-weight:700}.plan .pbox{padding:3px 8px!important;gap:0!important;font-size:8.5pt}.plan tr,.plan .blk,.plan .pbox{break-inside:avoid}.plan h3{break-after:avoid}.plan .k{background:#eee!important;color:#000!important}}
</style>
<style>
/* تواصل وآراء الزملاء */
.cbtns{display:flex;flex-wrap:wrap;gap:10px}
.cbtns .btn{display:inline-flex;align-items:center;gap:6px}
.cform{display:flex;flex-direction:column;gap:12px}
textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:inherit;padding:10px 12px;font:inherit;resize:vertical}
.flink{color:inherit;text-decoration:underline;cursor:pointer;background:none;border:0;padding:0;font:inherit}
</style>
<script data-goatcounter="https://tayeb.goatcounter.com/count" data-goatcounter-settings='{"no_onload":true}' async src="//gc.zgo.at/count.js"></script>
<style>
/* ألعاب تعليمية */
.gbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.gbar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.gtop{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.gcard h3{margin:0}
.gopts{display:flex;flex-direction:column;gap:10px}
.gopt{min-height:52px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:inherit;font:inherit;font-weight:600;padding:10px 14px;cursor:pointer;text-align:start}
.gopt:hover:not(:disabled){border-color:var(--accent)}
.gopt.ok{background:var(--good-soft);border-color:var(--good);color:var(--ink)}
.gopt.no{background:var(--bad-soft);border-color:var(--bad);color:var(--ink)}
.gbins{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gitem{font-family:var(--f-book);font-size:1.35rem;line-height:1.9;text-align:center;border:2px dashed var(--gold);border-radius:12px;padding:18px 12px;background:var(--gold-soft)}
.gfb{border-radius:10px;padding:10px 14px;line-height:1.8}
.gfb.ok{background:var(--good-soft)}.gfb.no{background:var(--bad-soft)}
.gres{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.gres .big{font-size:2.6rem;font-weight:800;color:var(--accent)}
.gbadge{display:inline-block;background:var(--good-soft);color:var(--good);border-radius:99px;padding:0 10px;font-size:.85rem;font-weight:700}
</style>
<style>
/* سمات وأشكال الألعاب: لكل لعبة theme وshape في ملفها */
.gw{--accent:#0f6b5c}
.gw[data-th="ocean"]{--accent:#0b6fa4;--accent-ink:#fff;--gold-soft:#e3f1fa;--gold:#0b6fa4}
.gw[data-th="sunset"]{--accent:#b8500f;--accent-ink:#fff;--gold-soft:#fdeedd;--gold:#b8500f}
.gw[data-th="violet"]{--accent:#6a3fb5;--accent-ink:#fff;--gold-soft:#eee8fa;--gold:#6a3fb5}
.gw[data-th="rose"]{--accent:#b5305f;--accent-ink:#fff;--gold-soft:#fbe6ee;--gold:#b5305f}
.gw[data-th="forest"]{--accent:#2f6b2f;--accent-ink:#fff;--gold-soft:#e8f3e2;--gold:#2f6b2f}
:root[data-theme="dark"] .gw[data-th]{--gold-soft:#2b2b36}
.gban{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:12px 16px;display:flex;gap:12px;align-items:center;font-weight:800;font-size:1.1rem}
.gban .ic{font-size:1.8rem}
.gw[data-sh="pill"] .gopt,.gw[data-sh="pill"] .gitem{border-radius:999px;text-align:center}
.gw[data-sh="pill"] .gban{border-radius:999px}
.gw[data-sh="sharp"] .gopt,.gw[data-sh="sharp"] .gcard,.gw[data-sh="sharp"] .gitem,.gw[data-sh="sharp"] .gban{border-radius:3px;border-width:3px}
.gw[data-sh="grid"] .gopts{display:grid;grid-template-columns:1fr 1fr}
.gw[data-sh="grid"] .gopt{text-align:center}
.gw[data-sh="chips"] .gopts{flex-direction:row;flex-wrap:wrap}
.gw[data-sh="chips"] .gopt{flex:1 1 auto;border-radius:999px;text-align:center}
.gtf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gtf .gopt{min-height:72px;font-size:1.2rem;text-align:center}
.gflip{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.gcf{min-height:84px;border-radius:12px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;font-size:1.2rem;cursor:pointer;padding:8px}
.gcf.open{background:var(--bg);color:var(--ink);font-size:.95rem}
.gcf.ok{background:var(--good-soft);border-color:var(--good);color:var(--ink);font-size:.95rem}
.gcf.no{background:var(--bad-soft);border-color:var(--bad);color:var(--ink);font-size:.95rem}

/* القرآن: subjects/<المادة>/quran/index.json (قائمة أسماء الملفات) + <الاسم>.json لكل سورة أو مقطع */
.qx{--q1:#2563a8;--q2:#c02350;--q3:#7a45d6;--q4:#0c8a8f;--q5:#0b8a5a;--q6:#b86b00;--q7:#6d3fc4;--q8:#1b8f3a;--q9:#d1560e;--q10:#d02727;--q11:#c2287a}
:root[data-theme="dark"] .qx,.qxd{--q1:#6bb6f5;--q2:#ff8aa5;--q3:#b99cf6;--q4:#4fd0d6;--q5:#4fd59c;--q6:#f3b04e;--q7:#c7a6fa;--q8:#6fda8a;--q9:#ff9a5c;--q10:#ff8484;--q11:#ff9ccc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .qx{--q1:#6bb6f5;--q2:#ff8aa5;--q3:#b99cf6;--q4:#4fd0d6;--q5:#4fd59c;--q6:#f3b04e;--q7:#c7a6fa;--q8:#6fda8a;--q9:#ff9a5c;--q10:#ff8484;--q11:#ff9ccc}}
.qtext{font-family:"Scheherazade New","Amiri",serif;line-height:2.7;text-align:start;background:var(--surface);border:2px solid var(--gold-soft);border-radius:14px;padding:18px 16px}
.qv{cursor:pointer;border-radius:8px;padding:2px 4px}
.qv:hover{background:var(--gold-soft)}
.qv.on{background:var(--gold-soft);box-shadow:0 0 0 2px var(--gold)}
.qn{display:inline-flex;align-items:center;justify-content:center;min-width:2.1rem;height:2.1rem;margin:0 4px;border:2px solid var(--gold);border-radius:50%;font:700 .8rem var(--f-book);color:var(--ink);user-select:none}
.qx [class^="tj-"]{font-weight:700;border-bottom:2px solid currentColor}
.qx .tj-naql{color:var(--q1);border-bottom-style:dashed}
.qx .tj-taqleel{color:var(--q2);border-bottom-style:dashed}
.qx .tj-badal{color:var(--q3);border-bottom-style:double}
.qx .tj-leen{color:var(--q4);border-bottom-style:dotted}
.qx .tj-tarqeeq-raa{color:var(--q5);border-bottom-style:dotted;font-style:italic}
.qx .tj-taghleeth-lam{color:var(--q6)}
.qx .tj-mad{color:var(--q7)}
.qx .tj-ghunnah{color:var(--q8);border-bottom-style:dotted}
.qx .tj-ikhfa{color:var(--q9);border-bottom-style:dotted}
.qx .tj-qalqalah{color:var(--q10)}
.qx .tj-iqlab{color:var(--q11);border-bottom-style:dotted}
.qx .tj-izhar{color:var(--q4);border-bottom-style:dotted}
.qx.off-naql .tj-naql,.qx.off-taqleel .tj-taqleel,.qx.off-badal .tj-badal,.qx.off-leen .tj-leen,.qx.off-tarqeeq .tj-tarqeeq-raa,.qx.off-taghleeth .tj-taghleeth-lam,.qx.off-mad .tj-mad,.qx.off-ghunnah .tj-ghunnah,.qx.off-qalqalah .tj-qalqalah{color:inherit;font-weight:400;font-style:normal;border-bottom:none}
.qkey{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.qkey button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 12px;min-height:34px;cursor:pointer;font-size:.9rem;display:inline-flex;align-items:center;gap:6px}
.qkey button.off{opacity:.4}
.qkey i{width:10px;height:10px;border-radius:50%;display:inline-block}
.qbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.qbar input[type=search]{flex:1;min-width:160px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:4px 12px;min-height:40px}
.qdraft{background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn);border-radius:10px;padding:6px 12px;margin:6px 0;font-size:.95rem}
.gchk{display:flex;flex-direction:column;gap:6px;margin:8px 0}.gchk label{display:flex;gap:8px;align-items:center;cursor:pointer}
.qlay{display:grid;grid-template-columns:1fr;gap:12px;align-items:start}
.qpanel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:0 -4px 14px rgba(0,0,0,.08);position:sticky;bottom:0;max-height:46vh;overflow-y:auto;z-index:5}
@media (min-width:900px){.qlay{grid-template-columns:1fr 360px}.qpanel{bottom:auto;top:12px;max-height:calc(100vh - 24px);box-shadow:none}}
.qitem h4{margin:0 0 4px;color:var(--gold);font-size:.95rem}
.qhead{background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:10px 14px}
.qhead .ar{font:1.35rem/2 "Scheherazade New","Amiri",serif}
.qtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:10px 0}
.qtabs button{flex:1;border:0;border-bottom:3px solid transparent;background:none;cursor:pointer;min-height:40px;color:var(--muted);font-weight:700}
.qtabs button[aria-selected=true]{color:var(--accent);border-color:var(--accent)}
.qitem{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:8px 0}
.qitem b{color:var(--accent)}
.qitem em{float:left;font-style:normal;background:var(--gold-soft);color:var(--ink);border-radius:6px;padding:0 8px;font-size:.85rem}
.qitem p{margin:2px 0 0}
</style>
</head>
<body>
<div dir="rtl" lang="ar">
<header class="top"><div class="wrap">
  <div class="toprow"><h1 id="h1" title="الرئيسية">فضاء الدروس</h1><button class="iconbtn" id="theme" aria-label="تبديل الوضع الليلي">◐</button></div>
  <span class="tagline" id="tagline"></span>
  <div class="subjline" id="subjline" hidden></div>
  <nav class="tabs" role="tablist" aria-label="أقسام الموقع">
    <button role="tab" data-tab="lessons">الدروس</button>
    <button role="tab" data-tab="questions">سؤال وجواب</button>
    <button role="tab" data-tab="exams">نماذج الأسئلة</button>
    <button role="tab" data-tab="quran" id="tabQ" hidden>القرآن</button>
    <button role="tab" data-tab="games">ألعاب</button>
    <button role="tab" data-tab="gen">مقترح الفروض</button>
    <button role="tab" data-tab="plans">مذكرات الأستاذ</button>
    <button role="tab" data-tab="assessment" id="tabA">التقويم المستمر</button>
    <button role="tab" data-tab="contact" id="tabC" hidden>تواصل</button>
  </nav>
</div></header>
<div class="wrap"><main id="main"></main>
<footer id="foot">المحتوى مرتب حسب المادة والمستوى. كل درس مكتوب بإيجاز ليسهل نسخه في الكراس ومراجعته في البيت.</footer></div>
</div>

<script>
/* كل مادة: subjects/<المادة>.json (معلومات المادة) + subjects/<المادة>/lessons/<المستوى>-<الرقم>.json (درس واحد في ملف). */
const $=s=>document.querySelector(s);
const main=$("#main");
let SITE={name:"فضاء الدروس",tagline:"",footer:""}, SUBJECTS=[], S=null, tab="lessons", lvl="", openLesson=null, qLesson="all", srch="";
const seen=()=>{try{return JSON.parse(store.get("seen")||"[]")}catch(e){return[]}};
const markSeen=id=>{const a=seen(),k=S.id+":"+id;if(!a.includes(k)){a.push(k);store.set("seen",JSON.stringify(a))}};
const LOADED={};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const lvName=id=>(S.levels.find(l=>l.id===id)||{n:""}).n;
const lvChips=cur=>`<div class="chips" role="group" aria-label="المستوى">${S.levels.map(l=>`<button class="chip" data-lv="${l.id}" aria-pressed="${l.id===cur}">${l.n}</button>`).join("")}</div>`;
const LV=()=>LOADED[S.id+"|"+lvl]||[];

async function loadLevel(lv){
  const key=S.id+"|"+lv; if(LOADED[key]) return LOADED[key];
  const max=S.maxLessons||12;
  const res=await Promise.all(Array.from({length:max},(_,i)=>{
    const n=i+1, f=`subjects/${S.id}/lessons/${lv}-${String(n).padStart(2,"0")}.json`;
    return fetch(f).then(r=>r.ok?r.json():null).catch(()=>null).then(x=>x?Object.assign(x,{id:lv+"-"+n,lv,num:n}):{id:lv+"-"+n,lv,num:n,soon:true,title:"الدرس "+n});
  }));
  let last=0; res.forEach(l=>{if(!l.soon) last=l.num});
  return LOADED[key]=res.filter(l=>l.num<=last);
}

function bodyHtml(b){
  let h="";
  if(b.p) h+=`<p>${b.p}</p>`;
  if(b.subs) h+=b.subs.map(x=>`<p><b>${x.h}:</b> ${x.p}</p>`).join("");
  if(b.ol) h+=`<ol>${b.ol.map(i=>`<li>${i}</li>`).join("")}</ol>`;
  if(b.ul) h+=`<ul>${b.ul.map(i=>`<li>${i}</li>`).join("")}</ul>`;
  if(b.groups) h+=`<div class="groups">${b.groups.map(g=>`<div class="grp"><h4>${g.h}</h4><ol>${g.ol.map(i=>`<li>${i}</li>`).join("")}</ol></div>`).join("")}</div>`;
  if(b.table) h+=`<div class="tw"><table><thead><tr>${b.table.cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${b.table.rows.map(r=>`<tr>${r.map((c,i)=>`<td data-label="${b.table.cols[i]}" class="${b.table.ayat&&i===r.length-1?"ayat":""}">${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  if(b.proofs) h+=`<div class="proofs">${b.proofs.map(p=>`<div class="proof"><b>${p.l}</b><div class="ayat">${p.t}</div><small>${p.s}</small></div>`).join("")}</div>`;
  return h;
}
function renderBlock(b){return `<div class="blk"><h3>${b.h}</h3>${(b.parts||[b]).map(bodyHtml).join("")}</div>`}
function renderLessons(){
  const list=LV();
  if(openLesson){
    const L=list.find(x=>x.id===openLesson);
    const qs=(L.questions||[]).length;
    main.innerHTML=`<div class="row"><button class="btn ghost" id="back">العودة إلى القائمة</button><button class="btn ghost" id="prt">اطبع الدرس</button></div>
    ${L.map?`<p class="hint">اكتب الدرس الآتي في كراسك. المخطط الذهني في أسفل الصفحة للحفظ والمراجعة فقط، ولا يُكتب.</p>`:""}
    <article class="sheet">
      <div class="dateline">التاريخ: ........................................</div>
      <div class="meta"><span>الدرس رقم: <b>${L.num}</b></span><span>الميدان: <b>${L.domain}</b></span><span>الموضوع المعرفي: <b>${L.topic}</b></span><span>المستوى: <b>${lvName(L.lv)}</b></span></div>
      <h2>${L.title}</h2>${L.blocks.map(renderBlock).join("")}
      ${L.memo?`<div class="memo"><small>للحفظ: ${L.memo.src}</small>${L.memo.t}</div>`:""}
    </article>
    ${L.map?`<section class="mapbox"><div><h3>المخطط الذهني</h3><p class="note">للحفظ والمراجعة فقط. لا تكتبه في الكراس.</p></div>
      <div class="row"><button class="btn" id="mapbtn" aria-expanded="false" aria-controls="mapfig">اعرض المخطط الذهني</button><a class="btn ghost" href="${L.map.img}" target="_blank" rel="noopener">افتح الصورة كاملة</a></div>
      <figure id="mapfig" hidden><img src="${L.map.img}" alt="${L.map.alt||"المخطط الذهني للدرس"}" loading="lazy"></figure></section>`:""}
    ${qs?`<div class="row"><button class="btn" id="toq">تدرّب على أسئلة هذا الدرس (${qs})</button></div>`:""}`;
    $("#back").onclick=()=>{openLesson=null;render()};
    $("#prt").onclick=()=>window.print();
    const t=$("#toq"); if(t) t.onclick=()=>{qLesson=L.id;go("questions")};
    const mb=$("#mapbtn"); if(mb) mb.onclick=()=>{const f=$("#mapfig");f.hidden=!f.hidden;mb.setAttribute("aria-expanded",String(!f.hidden));mb.textContent=f.hidden?"اعرض المخطط الذهني":"أخفِ المخطط الذهني"};
    window.scrollTo(0,0);return;
  }
  const sn=seen(), done=list.filter(l=>!l.soon&&sn.includes(S.id+":"+l.id)).length, tot=list.filter(l=>!l.soon).length;
  const q=srch.trim(), shown=q?list.filter(l=>!l.soon&&(l.title+" "+(l.sum||"")+" "+(l.domain||"")+" "+(l.topic||"")).includes(q)):list;
  main.innerHTML=`<div><h2>دروس ${lvName(lvl)}</h2><p class="lead">اختر مستواك، ثم افتح الدرس الذي فاتك واكتبه في كراسك كما هو.</p></div>${lvChips(lvl)}
  <div class="stat"><span>عدد الدروس المنشورة: ${tot}</span><span>قرأتَ منها: ${done}</span></div>
  <div class="search"><input type="text" id="srch" placeholder="ابحث في الدروس: عنوان أو موضوع" value="${q.replace(/"/g,"&quot;")}" aria-label="بحث في الدروس"></div>
  <div class="grid">${shown.map(l=>l.soon
    ?`<div class="lcard soon" aria-disabled="true"><span class="no">${l.num}</span><small>الدرس ${l.num}</small><h3>${l.title}</h3><span>سيُنشر قريبا</span></div>`
    :`<button class="lcard" data-id="${l.id}"><span class="no">${l.num}</span><small>${l.domain||""}</small><h3>${l.title}</h3><span>${l.sum||""}</span>${sn.includes(S.id+":"+l.id)?'<span class="seen">✓ قرأتَه</span>':""}</button>`).join("")||'<p class="lead">لا نتائج.</p>'}</div>`;
  const si=$("#srch"); if(si) si.oninput=e=>{srch=e.target.value;const p=e.target.selectionStart;renderLessons();const n=$("#srch");n.focus();n.setSelectionRange(p,p)};
  main.querySelectorAll("button.lcard").forEach(b=>b.onclick=()=>{openLesson=b.dataset.id;markSeen(b.dataset.id);render()});
}

function renderQuestions(){
  const ls=LV().filter(l=>!l.soon&&(l.questions||[]).length);
  if(qLesson!=="all"&&!ls.find(l=>l.id===qLesson)) qLesson="all";
  const items=ls.filter(l=>qLesson==="all"||l.id===qLesson).flatMap(l=>l.questions.map(q=>({l,q})));
  main.innerHTML=`<div><h2>سؤال وجواب</h2><p class="lead">حاول الإجابة في كراسك أولا، ثم اضغط «أظهر الإجابة» وقارن.</p></div>${lvChips(lvl)}
  <div class="chips" role="group" aria-label="الدرس"><button class="chip" data-ql="all" aria-pressed="${qLesson==="all"}">كل الدروس</button>${ls.map(l=>`<button class="chip" data-ql="${l.id}" aria-pressed="${qLesson===l.id}">${l.title}</button>`).join("")}</div>
  ${items.map((x,i)=>`<div class="q"><span class="src">${x.l.title}</span><p>${i+1}. ${x.q.q}</p><div class="row"><button class="btn ghost" data-a="${i}">أظهر الإجابة</button></div><div class="ans" hidden>${x.q.a}</div></div>`).join("")||'<p class="lead">لا توجد أسئلة لهذا المستوى بعد.</p>'}`;
  main.querySelectorAll("[data-ql]").forEach(b=>b.onclick=()=>{qLesson=b.dataset.ql;render()});
  main.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{const a=b.closest(".q").querySelector(".ans");a.hidden=!a.hidden;b.textContent=a.hidden?"أظهر الإجابة":"أخفِ الإجابة"});
}

/* التقويم المستمر: لا تُحفظ أي علامة في هذه الصفحة. نتائج التلميذ تُعرض في صفحة منفصلة محمية برمز ورقم سري. */
function renderAssess(){
  const A=S.assessment||{};
  main.innerHTML=`<div><h2>التقويم المستمر</h2><p class="lead">يطّلع التلميذ أو وليّه على نتائج كتابة الدروس والحفظ والسلوك والفروض في مادة ${S.name}.</p></div>
  <div class="box">
   <h3>كيف تطّلع على النتائج</h3>
   <ol class="steps"><li>خذ من الأستاذ <b>رمز التلميذ</b> و<b>رقمه السري</b>.</li><li>افتح صفحة النتائج من الزر أدناه.</li><li>أدخل الرمز والرقم السري، فتظهر نتائجك أنت فقط.</li></ol>
   ${A.url?`<div class="row"><a class="btn" href="${A.url}" target="_blank" rel="noopener">افتح صفحة النتائج</a></div>`:`<div class="demo">صفحة النتائج قيد التجهيز وستُفتح هنا قريبا.</div>`}
   <p class="note">${A.note||""} لا تعطِ رقمك السري لأحد. الصفحة للقراءة فقط ولا تسمح بتغيير أي علامة.</p>
  </div>`;
}


/* نماذج الأسئلة الفصلية: subjects/<المادة>/exams/<المستوى>-<الفصل>-<الرقم>.json ، مثل 2-1-1.json (الثانية، الفصل 1، النموذج 1) */
const EXAMS={}; let exTerm=1, openExam=null;
async function loadExams(lv){
  const key=S.id+"|"+lv; if(EXAMS[key]) return EXAMS[key];
  const jobs=[]; for(let t=1;t<=3;t++) for(let n=1;n<=(S.maxExams||12);n++) jobs.push([t,n]);
  const res=await Promise.all(jobs.map(([t,n])=>fetch(`subjects/${S.id}/exams/${lv}-${t}-${n}.json`).then(r=>r.ok?r.json():null).catch(()=>null).then(x=>x?Object.assign(x,{id:lv+"-"+t+"-"+n,term:t,n}):null)));
  return EXAMS[key]=res.filter(Boolean);
}
function bindLv(){main.querySelectorAll("[data-lv]").forEach(b=>b.onclick=()=>{lvl=b.dataset.lv;store.set("ulum-lvl-"+S.id,lvl);openLesson=null;openExam=null;openPlan=null;openGame=null;GS=null;render()})}
async function renderExams(){
  const key=S.id+"|"+lvl;
  if(!EXAMS[key]){main.innerHTML=lvChips(lvl)+'<p class="lead">جارٍ التحميل...</p>';bindLv();await loadExams(lvl);if(tab==="exams"&&S.id+"|"+lvl===key)renderExams();return}
  const all=EXAMS[key];
  if(openExam){
    const E=all.find(x=>x.id===openExam);
    main.innerHTML=`<div class="row"><button class="btn ghost" id="back">العودة إلى النماذج</button><button class="btn ghost" id="prt">اطبع النموذج</button></div>
    <article class="sheet"><div class="meta"><span>المستوى: <b>${lvName(lvl)}</b></span><span>الفصل: <b>${(TERMS_AR[E.term-1])}</b></span>${E.duration?`<span>المدة: <b>${E.duration}</b></span>`:""}</div>
    <h2>${E.title}</h2>${(E.blocks||[]).map(renderBlock).join("")}</article>
    ${(E.answers||[]).length?`<section class="mapbox"><div><h3>الحل النموذجي</h3><p class="note">حاول الحل أولا في كراسك، ثم قارن.</p></div><div class="row"><button class="btn" id="ansbtn" aria-expanded="false">أظهر الحل</button></div><div id="anspane" hidden class="sheet">${E.answers.map(renderBlock).join("")}</div></section>`:""}`;
    $("#back").onclick=()=>{openExam=null;render()};$("#prt").onclick=()=>window.print();
    const ab=$("#ansbtn");if(ab)ab.onclick=()=>{const p=$("#anspane");p.hidden=!p.hidden;ab.setAttribute("aria-expanded",String(!p.hidden));ab.textContent=p.hidden?"أظهر الحل":"أخفِ الحل"};
    window.scrollTo(0,0);return;
  }
  const list=all.filter(x=>x.term===exTerm);
  main.innerHTML=`<div><h2>نماذج الأسئلة</h2><p class="lead">نماذج فصلية لمراجعة ${S.name}. اختر المستوى ثم الفصل.</p></div>${lvChips(lvl)}
  <div class="chips" role="group" aria-label="الفصل">${TERMS_AR.map((t,i)=>`<button class="chip" data-et="${i+1}" aria-pressed="${exTerm===i+1}">${t}</button>`).join("")}</div>
  <div class="grid">${list.map(x=>`<button class="lcard" data-ex="${x.id}"><span class="no">${x.n}</span><small>${TERMS_AR[x.term-1]}</small><h3>${x.title}</h3><span>${x.sum||""}</span></button>`).join("")||'<p class="lead">لم تُنشر نماذج هذا الفصل بعد.</p>'}</div>`;
  bindLv();
  main.querySelectorAll("[data-et]").forEach(b=>b.onclick=()=>{exTerm=Number(b.dataset.et);render()});
  main.querySelectorAll("[data-ex]").forEach(b=>b.onclick=()=>{openExam=b.dataset.ex;render()});
}
/* مقترح الفروض: subjects/<المادة>/generator/<المستوى>-<الفصل>.json = قائمة المواضيع topics + وحدات units تشير إلى وضعية في نموذج موجود {exam,i,slot,topic,pts}. الأستاذ يختار الدروس المدرّسة فقط فتُسحب الوضعيات منها. */
const GENS={}; let GEN={sel:{},cur:null,last:[]};
async function loadGen(lv,t){
  const key=S.id+"|"+lv+"|"+t; if(key in GENS) return GENS[key];
  let g=null; try{const r=await fetch(`subjects/${S.id}/generator/${lv}-${t}.json`);if(r.ok)g=await r.json()}catch(e){}
  return GENS[key]=g;
}
const pickRnd=a=>a[Math.floor(Math.random()*a.length)];
function genBuild(g,exams){
  const sel=g.topics.filter(t=>GEN.sel[t.id]).map(t=>t.id);
  const kind=id=>(g.topics.find(t=>t.id===id)||{}).kind;
  const taught=new Set(sel); g.topics.forEach(t=>{if(GEN.sel[t.id]&&t.after)taught.add(t.after)});
  const newest=g.topics.filter(t=>GEN.sel[t.id]&&t.after).map(t=>t.id);
  const cov=u=>u.covers||[u.topic];
  const std={surah:6,lesson:6,integrative:8};
  const uid=u=>u.id||(u.exam+"#"+u.i);
  const base=slot=>g.units.filter(u=>u.slot===slot&&u.pts===std[slot]&&cov(u).every(c=>taught.has(c))&&cov(u).some(c=>(slot==="surah")===(kind(c)==="surah")&&sel.includes(c)));
  const prefer=p=>{const q=p.filter(u=>cov(u).some(c=>newest.includes(c)));return q.length?q:p};
  const fresh=p=>{const f=p.filter(u=>!GEN.last.includes(uid(u)));return f.length?f:p};
  const names={surah:"وضعية السورة",lesson:"وضعية الدرس",integrative:"الوضعية الإدماجية"};
  const sp=prefer(base("surah")); if(!sp.length) return {err:`لا توجد في البنك وضعية مناسبة لـ«${names.surah}» ضمن الدروس التي اخترتَها. اختر درسًا آخر أو أضف إليها.`};
  const surah=pickRnd(fresh(sp));
  /* الوضعيتان الثانية والأخيرة: درسان مختلفان يتناوبان في الموضعين، فلا يتكرر درس في وضعيتين ولا يُحصر درس في موضع واحد */
  const L=base("lesson"), I=base("integrative");
  const grp=id=>((g.topics.find(t=>t.id===id)||{}).group)||id; /* أجزاء الدرس الواحد (الحج 1 والحج 2) تُعامل كدرس واحد */
  const grps=u=>cov(u).map(grp);
  const disj=(a,b)=>!grps(a).some(c=>grps(b).includes(c));
  const pairs=[];
  for(const uL of L) for(const uI of I) if(disj(uL,uI)) pairs.push([uL,uI]);
  if(!pairs.length) return {err:"اختر درسين مختلفين على الأقل (غير السورة) ليُركَّب منهما الفرض دون تكرار درس في وضعيتين، وتأكد أن لكل منهما وضعيات في البنك."};
  const pp=prefer2(pairs);
  /* اختيار زوج المواضيع أولًا بالتساوي ثم الوحدتين، حتى لا يطغى درس كثرت وضعياته */
  const key=([a,b])=>grp(a.topic)+">"+grp(b.topic);
  const keys=[...new Set(pp.map(key))];
  let k=pickRnd(keys);
  const cand=pp.filter(x=>key(x)===k);
  const fr=cand.filter(([a,b])=>!GEN.last.includes(uid(a))&&!GEN.last.includes(uid(b)));
  const [uL,uI]=pickRnd(fr.length?fr:cand);
  function prefer2(ps){const q=ps.filter(([a,b])=>cov(a).concat(cov(b)).some(c=>newest.includes(c)));return q.length?q:ps}
  const out=[surah,uL,uI];
  const ord=["الأولى","الثانية","الثالثة"], blocks=[], answers=[];
  out.forEach((u,k)=>{
    let B,A; if(u.block){B=u.block;A=u.answer}else{const E=exams.find(x=>x.id===u.exam); if(!E) return; B=E.blocks[u.i];A=E.answers&&E.answers[u.i]}
    const pts=String(u.pts).padStart(2,"0")+" نقاط";
    const hd=u.slot==="integrative"?`الوضعية الإدماجية (${pts})`:`الوضعية ${ord[k]} (${pts})`;
    blocks.push(Object.assign({},B,{h:hd}));
    if(A) answers.push(Object.assign({},A,{h:hd.replace(/\s*\(.*\)/,"")}));});
  return {blocks,answers,src:out.map(u=>u.src||(u.exam+"/"+(u.i+1))),used:out.map(uid)};
}

/* ألعاب: subjects/<المادة>/games/<المستوى>-<NN>.json ، مثل 4-01.json. أنواع الخطوات: learn (بطاقة تعلّم)، quiz، sort (تصنيف)، scenario (موقف)، order (ترتيب)، match (توصيل)، tf (صح/خطأ)، fill (أكمل)، flip (ذاكرة). في ملف اللعبة: theme (ocean, sunset, violet, rose, forest) وshape (pill, sharp, grid, chips). */
const GAMES={}; let openGame=null, GS=null;
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

const gBest=id=>Number(store.get(gKey(id)))||0;
async function loadGames(lv){

  const max=S.maxGames||12;
  const res=await Promise.all(Array.from({length:max},(_,i)=>{const n=i+1;
    return fetch(`subjects/${S.id}/games/${lv}-${String(n).padStart(2,"0")}.json`).then(r=>r.ok?r.json():null).catch(()=>null).then(x=>x?Object.assign(x,{id:lv+"-"+n,num:n}):null)}));
  return GAMES[key]=res.filter(Boolean);
}
function gUnits(g){
  const u=[];
  (g.steps||[]).forEach(st=>{
    if(st.type==="learn") u.push({k:"learn",st});
    else if(st.type==="quiz"){const correct=st.opts[st.a];const opts=shuf(st.opts).map(t=>({t,ok:t===correct}));u.push({k:"quiz",st,opts})}
    else if(st.type==="sort") shuf(st.items).forEach(it=>u.push({k:"sort",st,it}));
    else if(st.type==="scenario") u.push({k:"scenario",st,choices:shuf(st.choices)});
    else if(st.type==="tf") shuf(st.items).forEach(it=>u.push({k:"tf",st,it}));
    else if(st.type==="fill"){const correct=st.opts[st.a];u.push({k:"fill",st,opts:shuf(st.opts).map(t=>({t,ok:t===correct}))})}
    else if(st.type==="flip") u.push({k:"flip",st,cards:shuf(st.pairs.flatMap((p,i)=>[{t:p[0],i},{t:p[1],i}]))});
    else if(st.type==="order") u.push({k:"order",st,pool:shuf(st.items.map((t,i)=>({t,i})))});
    else if(st.type==="match") u.push({k:"match",st,left:st.pairs.map((p,i)=>({t:p[0],i})),right:shuf(st.pairs.map((p,i)=>({t:p[1],i})))});
  });
  return u;
}

    pane.innerHTML=`<div class="gcard"><h3>أكمل الفراغ</h3><div class="gitem">${u.st.q.replace("____",'<span style="border-bottom:3px solid var(--accent);padding:0 18px">&nbsp;</span>')}</div><div class="gopts" style="flex-direction:row;flex-wrap:wrap">${u.opts.map((o,j)=>`<button class="gopt" data-j="${j}" style="flex:1 1 auto;text-align:center">${o.t}</button>`).join("")}</div><div id="gfb" class="gfb" hidden></div><div id="gnx" hidden>${next()}</div></div>`;
    pane.querySelectorAll(".gopt").forEach(b=>b.onclick=()=>{const o=u.opts[b.dataset.j];pane.querySelectorAll(".gopt").forEach((x,j)=>{x.disabled=true;if(u.opts[j].ok)x.classList.add("ok");else if(x===b)x.classList.add("no")});if(o.ok)GS.score++;fb(o.ok,u.st.why||"");wire()});
    return;
  }
  if(u.k==="flip"){
    GS.max++;let open=[],lock=false,mis=0,done=0;
    pane.innerHTML=`<div class="gcard"><h3>${u.st.q}</h3><p class="note" style="margin:0">اقلب بطاقتين لتجد الزوج المتطابق.</p><div class="gflip">${u.cards.map((c,j)=>`<button class="gcf" data-j="${j}">؟</button>`).join("")}</div><div id="gfb" class="gfb" hidden></div><div id="gnx" hidden>${next()}</div></div>`;
    const bs=[...pane.querySelectorAll(".gcf")];
    bs.forEach(b=>b.onclick=()=>{const j=Number(b.dataset.j);if(lock||b.classList.contains("ok")||open.includes(j))return;
      b.classList.add("open");b.textContent=u.cards[j].t;open.push(j);
      if(open.length===2){const [a,c]=open;
        if(u.cards[a].i===u.cards[c].i){bs[a].classList.remove("open");bs[c].classList.remove("open");bs[a].classList.add("ok");bs[c].classList.add("ok");open=[];done++;
          if(done===u.st.pairs.length){if(mis<=u.st.pairs.length)GS.score++;fb(mis<=u.st.pairs.length,`عدد المحاولات الخاطئة: ${mis}.`);wire()}}
        else{mis++;lock=true;bs[a].classList.add("no");bs[c].classList.add("no");setTimeout(()=>{[a,c].forEach(k=>{bs[k].classList.remove("open","no");bs[k].textContent="؟"});open=[];lock=false},900)}}});
    return;
  }
  if(u.k==="order"){
    GS.max++;let nextI=0,mis=0;const placed=[],pool=u.pool.slice();
    const paint=()=>{pane.querySelector("#og").innerHTML=pool.map(o=>`<button class="gopt" data-i="${o.i}">${o.t}</button>`).join("");
      pane.querySelector("#op").innerHTML=placed.map((o,k)=>`<li>${o.t}</li>`).join("")||'<li class="note" style="list-style:none">اضغط الخطوات بالترتيب الصحيح</li>';
      pane.querySelectorAll("#og .gopt").forEach(b=>b.onclick=()=>{const i=Number(b.dataset.i);
        if(i===nextI){const k=pool.findIndex(o=>o.i===i);placed.push(pool.splice(k,1)[0]);nextI++;
          if(nextI===u.st.items.length){if(mis===0)GS.score++;paint();fb(mis===0,mis?`أخطأتَ ${mis} مرة. هذا هو الترتيب كما في الدرس.`:"ترتيب صحيح من أول مرة.");wire();return}
          paint()}
        else{mis++;b.classList.add("no");setTimeout(()=>b.classList.remove("no"),500)}});};
    pane.innerHTML=`<div class="gcard"><h3>${u.st.q}</h3><ol id="op" style="margin:0;padding-inline-start:1.4em;display:flex;flex-direction:column;gap:6px"></ol><div class="gopts" id="og"></div><div id="gfb" class="gfb" hidden></div><div id="gnx" hidden>${next()}</div></div>`;
    paint();return;
  }
  if(u.k==="match"){
    GS.max++;let sel=null,mis=0,done=0;const L={},R={};
    pane.innerHTML=`<div class="gcard"><h3>${u.st.q}</h3><p class="note" style="margin:0">اضغط عنصرًا من القائمة الأولى ثم ما يناسبه من الثانية.</p><div class="gbins" style="align-items:start"><div class="gopts" id="ml">${u.left.map(o=>`<button class="gopt" data-i="${o.i}">${o.t}</button>`).join("")}</div><div class="gopts" id="mr">${u.right.map(o=>`<button class="gopt" data-i="${o.i}">${o.t}</button>`).join("")}</div></div><div id="gfb" class="gfb" hidden></div><div id="gnx" hidden>${next()}</div></div>`;
    const lb=[...pane.querySelectorAll("#ml .gopt")],rb=[...pane.querySelectorAll("#mr .gopt")];
    lb.forEach(b=>b.onclick=()=>{if(b.disabled)return;lb.forEach(x=>x.style.outline="");sel=b;b.style.outline="3px solid var(--accent)"});
    rb.forEach(b=>b.onclick=()=>{if(b.disabled)return;if(!sel){return}
      if(sel.dataset.i===b.dataset.i){sel.classList.add("ok");b.classList.add("ok");sel.disabled=b.disabled=true;sel.style.outline="";sel=null;done++;
        if(done===u.st.pairs.length){if(mis===0)GS.score++;fb(mis===0,mis?`أخطأتَ ${mis} مرة.`:"توصيل صحيح من أول مرة.");wire()}}
      else{mis++;b.classList.add("no");setTimeout(()=>b.classList.remove("no"),500)}});
    return;
  }
  if(u.k==="scenario"){
    pane.innerHTML=`<div class="gcard"><div class="memo">${u.st.story}</div>${u.st.q?`<h3>${u.st.q}</h3>`:""}<div class="gopts">${u.choices.map((o,j)=>`<button class="gopt" data-j="${j}">${o.t}</button>`).join("")}</div><div id="gfb" class="gfb" hidden></div><div id="gnx" hidden>${next()}</div></div>`;
    GS.max++;
    pane.querySelectorAll(".gopt").forEach(b=>b.onclick=()=>{const o=u.choices[b.dataset.j];pane.querySelectorAll(".gopt").forEach((x,j)=>{x.disabled=true;if(u.choices[j].ok)x.classList.add("ok");else if(x===b)x.classList.add("no")});if(o.ok)GS.score++;fb(o.ok,o.why||"");wire()});
  }
}
function gEnd(){
  const {g,score,max}=GS; const pct=max?Math.round(score/max*100):100;
  if(pct>gBest(g.id)) store.set(gKey(g.id),String(pct));
  const msg=pct>=90?"ما شاء الله! إتقان ممتاز.":pct>=70?"أحسنت، نتيجة جيدة.":pct>=50?"محاولة طيبة، أعد اللعب لتتحسن.":"راجع الدرس ثم أعد المحاولة.";
  $("#gbar").style.width="100%";
  $("#gp").innerHTML=`<div class="gcard gres"><div class="big">${pct}%</div><p style="margin:0">${score} إجابة صحيحة من ${max}. ${msg}</p><div class="row" style="justify-content:center"><button class="btn" id="ga">العب مرة أخرى</button><button class="btn ghost" id="gb">كل الألعاب</button></div></div>`;
  $("#ga").onclick=()=>gStart(g);$("#gb").onclick=()=>{openGame=null;GS=null;render()};
}
async function renderGames(){
  const key=S.id+"|"+lvl;
  if(!GAMES[key]){main.innerHTML=lvChips(lvl)+'<p class="lead">جارٍ التحميل...</p>';bindLv();await loadGames(lvl);if(tab==="games"&&S.id+"|"+lvl===key)renderGames();return}
  const all=GAMES[key];
  if(openGame){
    const g=all.find(x=>x.id===openGame);
    if(!GS||GS.g!==g){main.innerHTML=`<div class="gw" data-th="${g.theme||""}" data-sh="${g.shape||""}"><div class="row"><button class="btn ghost" id="back">العودة إلى الألعاب</button></div>
    <div class="gban"><span class="ic">${g.icon||"🎮"}</span><span>${g.title}</span></div>
    <div class="gtop"><span id="gno"></span><span id="gsc"></span></div><div class="gbar"><i id="gbar" style="width:0"></i></div><div id="gp" style="display:flex;flex-direction:column;gap:12px;margin-top:12px"></div></div>`;
      $("#back").onclick=()=>{openGame=null;GS=null;render()};gStart(g)}
    window.scrollTo(0,0);return;
  }
  main.innerHTML=`<div><h2>ألعاب تعليمية</h2><p class="lead">العب لتراجع دروسك: تصنيف وأسئلة ومواقف. نتيجتك الفضلى تُحفظ على جهازك.</p></div>${lvChips(lvl)}
  <div class="grid">${all.map(x=>{const b=gBest(x.id);return `<button class="lcard" data-g="${x.id}"><span class="no">${x.icon||x.num}</span><small>${x.sum||""}</small><h3>${x.title}</h3>${b?`<span class="gbadge">أفضل نتيجة: ${b}%</span>`:""}</button>`}).join("")||'<p class="lead">لم تُنشر ألعاب هذا المستوى بعد.</p>'}</div>`;
  bindLv();
  main.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{openGame=b.dataset.g;GS=null;render()});
}

/* القرآن الكريم */
const QURAN={}; let openQuran=null, QS={ay:1,top:0,pane:"rules",off:{},fs:30,q:""};
const QRULES=[["naql","نقل","q1"],["taqleel","تقليل","q2"],["badal","مد البدل","q3"],["tarqeeq","ترقيق الراء","q5"],["taghleeth","تغليظ اللام","q6"],["mad","المد","q7"],["leen","اللين المهموز","q4"],["ghunnah","الغنة والإدغام","q8"],["qalqalah","القلقلة","q10"]];
const qn=t=>(t||"").replace(/[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g,"").replace(/[إأآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه");
async function loadQuran(){
  const base=`subjects/${S.id}/quran/`;
  let list=[];try{const r=await fetch(base+"index.json");if(r.ok)list=await r.json()}catch(e){}
  QURAN[S.id]=(await Promise.all(list.map(n=>fetch(base+n+".json").then(r=>r.ok?r.json():null).catch(()=>null).then(x=>x?Object.assign(x,{id:n}):null)))).filter(Boolean);
  const t=$("#tabQ"); if(t) t.hidden=!QURAN[S.id].length;
}
function qBind(){
  const q=$(".qx"); if(!q)return;
  q.className="qx"+Object.keys(QS.off).filter(k=>QS.off[k]).map(k=>" off-"+k).join("");
}
async function renderQuran(){
  if(!QURAN[S.id]){main.innerHTML='<p class="lead">جارٍ التحميل...</p>';await loadQuran();if(tab==="quran")renderQuran();return}
  const all=QURAN[S.id];
  if(!openQuran){
    main.innerHTML=`<div><h2>القرآن الكريم</h2><p class="lead">اختر سورة: مرّر الماوس (أو المس) أي آية فتظهر لك أحكام ورش وشرح المفردات والتفسير.</p></div>
    <div class="grid">${all.map(x=>`<button class="lcard" data-q="${x.id}"><span class="no">📖</span><small>${x.riwaya||""}</small><h3>${x.title}</h3><span>${x.meta||""}</span></button>`).join("")||'<p class="lead">لا توجد سور بعد.</p>'}</div>`;
    main.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{openQuran=b.dataset.q;QS.ay=1;QS.top=0;QS.q="";render()});
    return;
  }
  const d=all.find(x=>x.id===openQuran); if(!d){openQuran=null;render();return}
  const topics=d.topics||[];
  main.innerHTML=`<div class="row"><button class="btn ghost" id="qback">العودة إلى القرآن</button></div>
  <div class="qx"><h2>${d.title}</h2><p class="lead">${d.riwaya||""} · ${d.meta||""}</p>
  ${d.draft?`<p class="qdraft">⚠ ${d.draft}</p>`:""}
  ${topics.length?`<div class="qkey" id="qtop"><button data-t="0">كل الآيات</button>${topics.map(t=>`<button data-t="${t.id}" title="${t.desc||""}">${t.title}</button>`).join("")}</div>`:""}
  <div class="qkey" id="qrules">${QRULES.map(r=>`<button data-r="${r[0]}"><i style="background:var(--${r[2]})"></i>${r[1]}</button>`).join("")}</div>
  <div class="qbar"><input type="search" id="qsearch" placeholder="ابحث في الآيات"><button class="btn ghost" id="qm" aria-label="تصغير الخط">أ−</button><button class="btn ghost" id="qp" aria-label="تكبير الخط">أ+</button></div>
  <div class="qlay"><div class="qtext" id="qtext" style="font-size:${QS.fs}px"></div>
  <aside class="qpanel" id="qpanel" aria-live="polite"></aside></div></div>`;
  $("#qback").onclick=()=>{openQuran=null;render()};
  const draw=()=>{
    const v=d.verses.filter(x=>(!QS.top||x.topic===QS.top)&&(!QS.q||qn(x.text).includes(qn(QS.q))));
    $("#qtext").innerHTML=v.map(x=>`<span class="qv${x.n===QS.ay?" on":""}" data-n="${x.n}">${x.tj} <span class="qn">${x.n}</span></span> `).join("")||'<p class="lead">لا نتيجة.</p>';
    $("#qtext").querySelectorAll(".qv").forEach(e=>{const pick=()=>{if(QS.ay===+e.dataset.n)return;QS.ay=+e.dataset.n;$("#qtext").querySelectorAll(".qv").forEach(z=>z.classList.toggle("on",z===e));info()};
      e.onclick=pick; e.onmouseenter=()=>{if(matchMedia("(hover:hover)").matches)pick()}});
    qBind();
    document.querySelectorAll("#qtop button").forEach(b=>b.style.background=(+b.dataset.t===QS.top)?"var(--gold-soft)":"");
    document.querySelectorAll("#qrules button").forEach(b=>b.classList.toggle("off",!!QS.off[b.dataset.r]));
  };
  const info=()=>{
    const v=d.verses.find(x=>x.n===QS.ay)||d.verses[0]; if(!v)return;
    const t=topics.find(x=>x.id===v.topic);
    const ah=v.ahkam?`<p>${v.ahkam}</p>`:((v.rules||[]).map(r=>`<div class="qitem"><em>${r.word||""}</em><b>${r.rule||""}</b><p>${r.desc||""}</p></div>`).join(""));
    const wd=v.words?`<p>${v.words.split("|").map(x=>x.trim()).filter(Boolean).join("<br>")}</p>`:((v.vocab||[]).map(r=>`<div class="qitem"><b>${r.word}</b><p>${r.meaning}</p></div>`).join(""));
    $("#qpanel").innerHTML=`<div class="qhead"><b>الآية ${v.n}</b> <small>${t?" · "+t.title:""}</small><div class="ar">${v.text}</div></div>
    <div class="qitem"><h4>✨ أحكام ورش والتجويد</h4>${ah||'<p class="lead">لا أحكام مسجلة.</p>'}</div>
    <div class="qitem"><h4>📖 شرح الغريب والمفردات</h4>${wd||'<p class="lead">لا مفردات مسجلة.</p>'}</div>
    <div class="qitem"><h4>💡 التفسير والمعنى الإجمالي</h4>${v.theme?`<p>${v.theme}</p>`:'<p class="lead">لم يُسجَّل بعد.</p>'}</div>`;
  };
  document.querySelectorAll("#qtop button").forEach(b=>b.onclick=()=>{QS.top=+b.dataset.t;draw()});
  document.querySelectorAll("#qrules button").forEach(b=>b.onclick=()=>{QS.off[b.dataset.r]=!QS.off[b.dataset.r];draw()});
  $("#qsearch").value=QS.q;$("#qsearch").oninput=e=>{QS.q=e.target.value.trim();draw()};
  $("#qm").onclick=()=>{QS.fs=Math.max(20,QS.fs-2);$("#qtext").style.fontSize=QS.fs+"px"};
  $("#qp").onclick=()=>{QS.fs=Math.min(48,QS.fs+2);$("#qtext").style.fontSize=QS.fs+"px"};
  draw();info();window.scrollTo(0,0);
}
const TERMS_AR=["الفصل الأول","الفصل الثاني","الفصل الثالث"];
function renderHeader(){
  $("#h1").textContent=SITE.name; $("#tagline").textContent=SITE.tagline||""; $("#tagline").hidden=!SITE.tagline;
  const home=tab==="home";
  document.title=home||!S?SITE.name:S.name+" · "+SITE.name;
  const sl=$("#subjline"); sl.hidden=home||!S;
  if(!home&&S){const extra=[S.teacher,S.school].filter(Boolean).map(x=>`<span>${x}</span>`).join("");
    sl.innerHTML=`<b>${S.icon?S.icon+" ":""}${S.name}</b>${extra}${SUBJECTS.length>1?'<button class="chip" id="chg" style="padding:0 12px;min-height:0;background:transparent;color:inherit;border-color:currentColor">غيّر المادة</button>':""}`;
    const c=$("#chg"); if(c) c.onclick=()=>go("home")}
  document.querySelector("nav.tabs").hidden=home;
  $("#tabA").hidden=!(S&&S.assessment);
  $("#tabC").hidden=!hasContact();
  $("#tabQ").hidden=!(S&&QURAN[S.id]&&QURAN[S.id].length);
  if(SITE.footer) $("#foot").textContent=SITE.footer;
  if(hasContact()){const f=$("#foot");if(!$("#flc")){f.insertAdjacentHTML("beforeend",' · <button class="flink" id="flc">تواصل معي وأبدِ رأيك</button>');$("#flc").onclick=()=>go("contact")}}
}
function renderHome(){
  main.innerHTML=`<div><h2>اختر المادة</h2><p class="lead">ادخل إلى مادتك ثم اختر مستواك لتجد دروسك مكتوبة وجاهزة للنسخ والمراجعة.</p></div>
  <div class="hero">${SUBJECTS.map(s=>`<button class="scard" data-s="${s.id}"><span class="ic">${s.icon||"📘"}</span><h3>${s.name}</h3>${s.desc?`<span class="lead">${s.desc}</span>`:""}<span class="lv">${s.levels.map(l=>`<i>${l.n}</i>`).join("")}</span>${[s.teacher,s.school].filter(Boolean).length?`<span class="note">${[s.teacher,s.school].filter(Boolean).join(" · ")}</span>`:""}</button>`).join("")}</div>`;
  main.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{pick(b.dataset.s);go("lessons")});
}
function pick(id){
  S=SUBJECTS.find(s=>s.id===id)||SUBJECTS[0]; store.set("ulum-subject",S.id);
  const saved=store.get("ulum-lvl-"+S.id); lvl=S.levels.some(l=>l.id===saved)?saved:S.levels[0].id;
  openLesson=null; qLesson="all"; srch="";
}
/* إحصاء الزيارات (GoatCounter، بلا ملفات تعريف ارتباط): يعدّ كل تبويب ومستوى ودرس/نموذج/مذكرة يُفتح */
let lastTrack="";
function track(){
  try{
    const id=openLesson||openExam||openPlan||openGame||openQuran||"";
    const path="/"+(tab==="home"?"home":[S&&S.id,tab,lvl,id].filter(Boolean).join("/"));
    if(path===lastTrack)return; lastTrack=path;
    if(window.goatcounter&&window.goatcounter.count)window.goatcounter.count({path:path,title:document.title,event:false});
  }catch(e){}
}
function render(){
  renderMain();track()}
function renderMain(){
  if(tab==="assessment"&&!(S&&S.assessment)) tab="lessons";
  if(tab==="contact"&&!hasContact()) tab="lessons";
  if(tab==="quran"&&!(S&&QURAN[S.id]&&QURAN[S.id].length)) tab="lessons";
  renderHeader();
  if(tab==="home"){renderHome();return}
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
  if(tab==="assessment"){renderAssess();return}
  if(tab==="exams"){renderExams();return}
  if(tab==="plans"){renderPlans();return}
  if(tab==="games"){renderGames();return}
  if(tab==="quran"){renderQuran();return}
  if(tab==="gen"){renderGen();return}
  if(tab==="contact"){renderContact();return}
  if(!LOADED[S.id+"|"+lvl]){
    main.innerHTML=lvChips(lvl)+'<p class="lead">جارٍ تحميل الدروس...</p>';
    main.querySelectorAll("[data-lv]").forEach(b=>b.onclick=()=>{lvl=b.dataset.lv;store.set("ulum-lvl-"+S.id,lvl);openLesson=null;render()});
    const want=S.id+"|"+lvl;
    loadLevel(lvl).then(()=>{if(S.id+"|"+lvl===want)render()});
    return;
  }
  ({lessons:renderLessons,questions:renderQuestions})[tab]();
  main.querySelectorAll("[data-lv]").forEach(b=>b.onclick=()=>{lvl=b.dataset.lv;store.set("ulum-lvl-"+S.id,lvl);openLesson=null;render()});
}
function go(t){tab=t;openLesson=null;openExam=null;openPlan=null;openGame=null;openQuran=null;GS=null;try{history.replaceState(null,"","#"+t)}catch(e){}render();window.scrollTo(0,0)}
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>go(b.dataset.tab));
const h=location.hash.slice(1); if(["lessons","questions","exams","gen","quran","games","plans","assessment","contact","home"].includes(h)) tab=h;
$("#h1").onclick=()=>{if(SUBJECTS.length>1)go("home")};
const applyTheme=t=>{if(t)document.documentElement.setAttribute("data-theme",t)};
applyTheme(store.get("theme"));
$("#theme").onclick=()=>{const dark=document.documentElement.getAttribute("data-theme")==="dark"||(!document.documentElement.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme:dark)").matches);const t=dark?"light":"dark";applyTheme(t);store.set("theme",t)};

(async()=>{
  main.innerHTML='<p class="lead">جارٍ التحميل...</p>';
  try{
    try{const r=await fetch("site.json");if(r.ok)SITE=Object.assign(SITE,await r.json())}catch(e){}
    const ids=await (await fetch("subjects/index.json")).json();
    SUBJECTS=await Promise.all(ids.map(id=>fetch("subjects/"+id+".json").then(r=>{if(!r.ok)throw 0;return r.json()})));
    pick(store.get("ulum-subject")); try{await loadQuran()}catch(e){} if(SUBJECTS.length>1&&!location.hash) tab="home"; render();
  }catch(e){main.innerHTML='<div class="err">تعذّر تحميل المحتوى. أعد تحميل الصفحة، وإن استمرت المشكلة فأخبر الأستاذ.</div>'}
})();
